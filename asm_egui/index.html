<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202124">
    <title>java-asm</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #202124;
        }

        body {
            display: flex;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }

        #startup-loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            gap: 12px;
            color: #e8eaed;
            background: #202124;
            font: 16px system-ui, sans-serif;
        }

        #startup-loading[hidden] {
            display: none;
        }

        .startup-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #5f6368;
            border-top-color: #8ab4f8;
            border-radius: 50%;
            animation: startup-spin 0.8s linear infinite;
        }

        @keyframes startup-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="return false;"></canvas>
    <div id="startup-loading" role="status" aria-live="polite">
        <div class="startup-spinner" aria-hidden="true"></div>
        <div>Loading java-asm...</div>
    </div>
    <link
        data-trunk
        rel="rust"
        data-bin="java_asm_egui"
        data-wasm-opt="z"
        data-wasm-opt-params="--all-features"
    />
</body>
</html>
