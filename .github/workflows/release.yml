name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update 
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # (required) GitHub token for creating GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}
          # (Optional) Create a draft release.
          # [default value: false]
          draft: true

  publish-crates:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev
      - name: Publish crates.io packages
        run: |
          cargo publish --locked -p java_asm_macro
          cargo publish --locked -p java_asm
          cargo publish --locked -p java_asm_server
          cargo publish --locked -p java_asm_cli

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            exe: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and upload release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          rustup target add "${TARGET}"
          cargo build --locked --release --target "${TARGET}" --bin java_asm_egui --bin java_asm_cli
          assets=()
          for binary in java_asm_egui java_asm_cli; do
            asset="${binary}-${TARGET}${EXE}"
            cp "target/${TARGET}/release/${binary}${EXE}" "${asset}"
            assets+=("${asset}")
          done
          gh release upload "${GITHUB_REF_NAME:?}" "${assets[@]}" --clobber

